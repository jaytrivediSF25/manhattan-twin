name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      # The regression suite is fully synthetic, so CI needs none of the ~4 GB
      # of downloaded data and stays fast.
      - name: Run tests
        run: uv run pytest tests/ -q

      - name: Lint
        run: uvx ruff check src tests
